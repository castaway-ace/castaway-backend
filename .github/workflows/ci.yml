name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded PR/dev runs; never cancel main runs (an in-flight deploy must finish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prisma client is generated into src/generated/prisma (gitignored);
      # required before type-checked lint.
      - run: npx prisma generate
      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Mocked unit specs; no services needed. test:e2e is intentionally not run.
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never push an image (or move :latest) for a commit that failed checks.
    needs: [lint, test]
    # Direct pushes to dev get lint + test only; PRs (any target) and main
    # pushes run the image build. Skipping build also auto-skips deploy.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        # Only main publishes — dev pushes and PRs must never move latest.
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two targets from one Dockerfile; the second build is almost entirely
      # cache hits because the production stage reuses the build layers.
      - name: Build migrate image (build stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: build
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/castaway-ace/castaway-backend:migrate-sha-${{ github.sha }}
            ghcr.io/castaway-ace/castaway-backend:migrate-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build app image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: production
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/castaway-ace/castaway-backend:sha-${{ github.sha }}
            ghcr.io/castaway-ace/castaway-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image-tag: sha-${{ github.sha }}
