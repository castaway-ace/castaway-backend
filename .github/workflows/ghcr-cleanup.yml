name: GHCR cleanup

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: castaway-backend
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 40
