$kind: http-request
url: "{{baseUrl}}/auth/signup"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userName": "<string>",
      "email": "<email>",
      "password": "<string>",
      "deviceInfo": {
        "clientId": "{{deviceClientId}}",
        "name": "Postman"
      }
    }
auth:
  type: noauth
order: 2000
