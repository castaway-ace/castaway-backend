$kind: http-request
url: "{{baseUrl}}/playlists/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: <string>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "name": "<string>"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 4000
