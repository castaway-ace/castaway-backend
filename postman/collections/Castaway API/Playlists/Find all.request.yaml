$kind: http-request
url: "{{baseUrl}}/playlists"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: onlyUser
    value: <boolean>
    disabled: true
  - key: order
    value: added
    disabled: true
    description: " (This can only be one of name,added)"
  - key: orderBy
    value: desc
    disabled: true
    description: " (This can only be one of asc,desc)"
  - key: limit
    value: "100"
    disabled: true
  - key: offset
    value: "0"
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
