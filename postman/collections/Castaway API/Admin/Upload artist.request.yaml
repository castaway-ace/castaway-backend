$kind: http-request
url: "{{baseUrl}}/admin/artists"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: <string>
      description: "(Required) "
    - type: file
      key: file
      src: []
      description: ""
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
