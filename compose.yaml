x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - UPLOAD_TMP_DIR=/mnt/data/castaway/tmp
      - JWT_ACCESS_SECRET_FILE=/run/secrets/jwt_access_secret
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_PRESIGNED_ENDPOINT=${STORAGE_PRESIGNED_ENDPOINT}
      - STORAGE_REGION=${STORAGE_REGION}
      - STORAGE_ACCESS_KEY_FILE=/run/secrets/storage_access_key
      - STORAGE_SECRET_ACCESS_KEY_FILE=/run/secrets/storage_secret_key
      - STORAGE_TRACKS_BUCKET=${STORAGE_TRACKS_BUCKET}
      - STORAGE_ALBUM_ART_BUCKET=${STORAGE_ALBUM_ART_BUCKET}
      - STORAGE_ARTIST_IMAGE_BUCKET=${STORAGE_ARTIST_IMAGE_BUCKET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - SWAGGER_USERNAME=${SWAGGER_USERNAME}
      - SWAGGER_PASSWORD_FILE=/run/secrets/swagger_password
    secrets:
      - database_url
      - jwt_access_secret
      - storage_access_key
      - storage_secret_key
      - admin_password
      - swagger_password
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging: *default-logging

  storage-perms:
    image: alpine:3.24
    user: root
    command: chown -R 10001:10001 /data # storage runs as uid 10001; it can't write /data without this
    restart: "no"
    logging: *default-logging

  storage:
    image: rustfs/rustfs:1.0.0
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      - RUSTFS_ACCESS_KEY_FILE=/run/secrets/storage_access_key # plain RUSTFS_ACCESS_KEY alongside this fails startup
      - RUSTFS_SECRET_KEY_FILE=/run/secrets/storage_secret_key
      - RUSTFS_VOLUMES=${STORAGE_VOLUMES}
      - RUSTFS_ADDRESS=${STORAGE_ADDRESS}
      - RUSTFS_CONSOLE_ADDRESS=${STORAGE_CONSOLE_ADDRESS}
      - RUSTFS_CONSOLE_ENABLE=${STORAGE_CONSOLE_ENABLE}
    secrets:
      - storage_access_key
      - storage_secret_key
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token # keeps the token out of `docker inspect`
      - TUNNEL_METRICS=127.0.0.1:20241 # keeps /config and /debug off the compose network
    secrets:
      - cloudflare_tunnel_token
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging: *default-logging

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
  postgres_password:
    environment: POSTGRES_PASSWORD
  database_url:
    environment: DATABASE_URL
  jwt_access_secret:
    environment: JWT_ACCESS_SECRET
  storage_access_key:
    environment: STORAGE_ACCESS_KEY
  storage_secret_key:
    environment: STORAGE_SECRET_ACCESS_KEY
  admin_password:
    environment: ADMIN_PASSWORD
  swagger_password:
    environment: SWAGGER_PASSWORD
